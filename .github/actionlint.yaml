paths:
  .github/workflows/vuln-scan.yaml:
    ignore:
      # GitHub documents job.workflow_repository and job.workflow_sha, but
      # actionlint 1.7.12 doesn't know them yet (rhysd/actionlint#647).
      # Remove once a release adds them.
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/code-scan.yaml:
    ignore:
      # Same unknown job.workflow_* properties as vuln-scan.yaml above.
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/nix-update-hash.yaml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/update-notice.yaml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/bump-npm-version.yaml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/publish-docker.yaml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
