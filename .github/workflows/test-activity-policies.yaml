name: Activity Policy Tests

# Validates ActivityPolicy manifests (including Kustomize directories) and
# runs declarative unit tests (*.test.yaml) offline in the
# ghcr.io/milo-os/activitytool image, pulled by its pinned digest.
# Logic lives in scripts/activity-policies/*.sh, checked out from this
# repository at the same commit as this workflow.
#
# Callers must grant `contents: read`.
#
# Usage, inputs, and local runs:
# https://github.com/datum-cloud/actions/blob/main/docs/activity-policies/README.md

on:
  workflow_call:
    inputs:
      path:
        description: Repository directory to inspect, relative to the repository root
        type: string
        default: "."
      policies-path:
        description: Comma- or newline-separated ActivityPolicy files, directories, or Kustomize directories relative to `path` (auto-discovered when empty)
        type: string
        default: ""
      tests-path:
        description: Comma- or newline-separated policy unit-test files or directories relative to `path` (auto-discovered when empty)
        type: string
        default: ""
      fail-on-untested:
        description: Fail when any validated ActivityPolicy has no unit tests
        type: boolean
        default: false
      allow-empty:
        description: Pass with a warning when no ActivityPolicy manifests or test files are found
        type: boolean
        default: false
      activitytool-version:
        description: ghcr.io/milo-os/activitytool tag, optionally pinned as vX.Y.Z@sha256:<digest>. Set it to the milo-os/activity release deployed where your policies run (default is the pin in install-activitytool.sh)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test-activity-policies:
    name: Test ActivityPolicies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SCAN_PATH: ${{ inputs.path }}
      POLICIES_PATH: ${{ inputs.policies-path }}
      TESTS_PATH: ${{ inputs.tests-path }}
      FAIL_ON_UNTESTED: ${{ inputs.fail-on-untested }}
      ALLOW_EMPTY: ${{ inputs.allow-empty }}
      ACTIVITYTOOL_VERSION: ${{ inputs.activitytool-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z $WORKFLOW_REPOSITORY || -z $WORKFLOW_SHA ]]; then
            echo "::error title=Activity policy tests::job.workflow_repository or job.workflow_sha is empty; this runner can't identify the workflow's own commit"
            exit 1
          fi
          if [[ -e $GITHUB_WORKSPACE/.activity-policies-action ]]; then
            echo "::error title=Activity policy tests::.activity-policies-action exists in the repository; it is the check's own checkout path"
            exit 1
          fi
          echo "Activity policy scripts: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Checkout scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .activity-policies-action
          sparse-checkout: |
            /scripts/activity-policies/*.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move scripts out of the workspace
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash "$GITHUB_WORKSPACE/.activity-policies-action/scripts/activity-policies/prepare.sh"

      - name: Install activitytool
        run: bash "$SCRIPTS/install-activitytool.sh"

      - name: Validate and test ActivityPolicies
        run: bash "$SCRIPTS/check.sh"
