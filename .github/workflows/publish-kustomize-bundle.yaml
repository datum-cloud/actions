# Single-image, dedicated-job publisher. For stamping MULTIPLE images (each with
# its own build-step tag) into one bundle from within the caller's job, see the
# composite action `publish-kustomize-bundle/action.yml`
# (`uses: datum-cloud/actions/publish-kustomize-bundle@<ref>`).
name: Publish Kustomize Bundle

on:
  workflow_call:
    inputs:
      bundle-name:
        required: true
        type: string
        description: "The full name of the bundle that should be used, including the repository (e.g. `ghcr.io/datum-cloud/telemetry-services-operator/crds`)"
      bundle-path:
        required: true
        type: string
        description: "The path to the bundle that should be used, relative to the root of the repository (e.g. `config/crds`)"
      images:
        required: false
        type: string
        description: |
          Multi-line YAML list of images to stamp into the bundle, one
          `{ path, name, tag }` entry each. `path` is a kustomization directory
          (relative to the repo root) to run `kustomize edit set image` in,
          `name` is the image to rewrite, and `tag` is optional — when omitted
          the entry falls back to the version of the bundle's first computed
          tag. Supersedes `image-name`/`image-overlays` when set. Example:
            images: |
              - { path: config/default, name: ghcr.io/datum-cloud/unikraft-provider, tag: "v0.0.0-pr-1-abc" }
              - { path: config/dependencies/ukp-runtime, name: ghcr.io/datum-cloud/ukp-runtime }
        default: ""
      image-overlays:
        required: false
        type: string
        description: "Comma-separated list of overlay paths where a single image should be set (e.g. 'config/base,config/apiserver,config/controller-manager'). Ignored when `images` is provided."
        default: ""
      image-name:
        required: false
        type: string
        description: "The single image name to set (e.g. 'ghcr.io/datum-cloud/datum-net'). Ignored when `images` is provided."
        default: ""
      debug:
        required: false
        type: boolean
        description: "Enable debug output and verification steps"
        default: false
    outputs:
      tags:
        description: "Generated tags for the bundle"
        value: ${{ jobs.publish-kustomize-bundle.outputs.tags }}
      labels:
        description: "Generated labels for the bundle"
        value: ${{ jobs.publish-kustomize-bundle.outputs.labels }}
      digest:
        description: "Digest of the published bundle"
        value: ${{ jobs.publish-kustomize-bundle.outputs.digest }}

jobs:
  publish-kustomize-bundle:
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.7.5
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.bundle-name }}
          tags: |
            type=ref,event=pr,suffix=-{{commit_date 'YYYYMMDD-HHmmss'}},prefix=v0.0.0-
            type=ref,event=pr,prefix=v0.0.0-
            type=ref,event=branch,suffix=-{{commit_date 'YYYYMMDD-HHmmss'}},prefix=v0.0.0-
            type=ref,event=branch,prefix=v0.0.0-
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=v0.0.0-

      - name: Set Image Tags from images list
        if: ${{ inputs.images != '' }}
        env:
          IMAGES: ${{ inputs.images }}
          BUNDLE_TAGS: ${{ steps.meta.outputs.tags }}
          BUNDLE_PATH: ${{ inputs.bundle-path }}
          DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail

          # Default tag for entries that don't pin their own: the version portion
          # of the bundle's first computed tag (mirrors the single-image path).
          DEFAULT_TAG="$(printf '%s\n' "$BUNDLE_TAGS" | head -n1 | cut -d':' -f2)"
          echo "Default image tag (bundle first tag): ${DEFAULT_TAG}"

          STAMPED_PATHS=()
          # yq turns the YAML list into one compact-JSON object per line; jq reads
          # each field. `.tag // ""` yields "" when the entry omits a tag.
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue

            path="$(printf '%s' "$entry" | jq -r '.path')"
            name="$(printf '%s' "$entry" | jq -r '.name')"
            tag="$(printf '%s' "$entry" | jq -r '.tag // ""')"
            [ -n "$tag" ] || tag="$DEFAULT_TAG"

            full_path="${GITHUB_WORKSPACE}/${path}"
            if [ ! -f "${full_path}/kustomization.yaml" ]; then
              echo "::error::${full_path}/kustomization.yaml not found"
              exit 1
            fi

            echo "Setting image ${name}:${tag} in ${path}"
            ( cd "${full_path}" && kustomize edit set image "${name}=${name}:${tag}" )
            STAMPED_PATHS+=("${full_path}")
          done < <(printf '%s\n' "$IMAGES" | yq -o=json -I=0 '.[]')

          if [ "${#STAMPED_PATHS[@]}" -eq 0 ]; then
            echo "::error::no images were parsed from the 'images' input"
            exit 1
          fi

          # Ensure the edits are flushed before the publish step reads them.
          sync

          if [ "${DEBUG}" = "true" ]; then
            echo "=== Stamped images: blocks ==="
            for full_path in "${STAMPED_PATHS[@]}"; do
              echo "--- ${full_path}/kustomization.yaml ---"
              yq '.images' "${full_path}/kustomization.yaml"
            done
            echo "=== Bundle structure at ${BUNDLE_PATH} ==="
            find "${GITHUB_WORKSPACE}/${BUNDLE_PATH}" -type f | sort
          fi

      - name: Set Image Tags in Kustomize Overlays
        if: ${{ inputs.images == '' && inputs.image-overlays != '' && inputs.image-name != '' }}
        run: |
          # Extract the first tag
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | cut -d':' -f2)
          
          echo "Will set image tag to: ${TAG}"
          echo "Image name: ${{ inputs.image-name }}"
          
          # Use absolute paths to avoid directory confusion
          WORKSPACE_ROOT="${GITHUB_WORKSPACE}"
          
          # Split the comma-separated overlay paths
          IFS=',' read -ra OVERLAYS <<< "${{ inputs.image-overlays }}"
          
          for overlay_path in "${OVERLAYS[@]}"; do
            overlay_path=$(echo "$overlay_path" | xargs)  # Trim whitespace
            FULL_PATH="${WORKSPACE_ROOT}/${overlay_path}"
            
            if [ -f "${FULL_PATH}/kustomization.yaml" ]; then
              echo "Setting image ${{ inputs.image-name }}:${TAG} in ${FULL_PATH}"
              
              pushd "${FULL_PATH}" > /dev/null
              kustomize edit set image "${{ inputs.image-name }}=${{ inputs.image-name }}:${TAG}"
              popd > /dev/null
              
              echo "Modified kustomization.yaml:"
              cat "${FULL_PATH}/kustomization.yaml"
            else
              echo "Error: ${FULL_PATH}/kustomization.yaml not found"
              exit 1
            fi
          done
          
          # CRITICAL: Ensure all filesystem operations are complete
          sync
          
          # Give the filesystem a moment to settle
          sleep 1
          
          echo "=== Final bundle structure ==="
          find "${{ inputs.bundle-path }}" -type f -o -type d | sort

      - name: Debug - Verify bundle structure before publish
        if: ${{ inputs.debug }}
        run: |
          echo "=== VERIFICATION: Bundle structure at ${{ inputs.bundle-path }} ==="
          echo "Absolute path: ${GITHUB_WORKSPACE}/${{ inputs.bundle-path }}"
          
          echo ""
          echo "Directory tree:"
          tree "${{ inputs.bundle-path }}" || ls -lR "${{ inputs.bundle-path }}"
          
          echo ""
          echo "File count:"
          find "${{ inputs.bundle-path }}" -type f | wc -l
          
          echo ""
          echo "Checking for expected directories:"
          for dir in base gateway; do
            if [ -d "${{ inputs.bundle-path }}/${dir}" ]; then
              echo "✅ ${dir}/ exists with $(find ${{ inputs.bundle-path }}/${dir} -type f | wc -l) files"
            else
              echo "❌ ${dir}/ NOT FOUND"
            fi
          done

      - name: Publish Bundle (with timing analysis)
        id: publish
        run: |
          BUNDLE_PATH="${GITHUB_WORKSPACE}/${{ inputs.bundle-path }}"
          
          echo "Publishing from: ${BUNDLE_PATH}"
          
          DIGEST=""
          PUSH_COUNT=0
          
          while IFS= read -r tag; do
            PUSH_COUNT=$((PUSH_COUNT + 1))
            
            # Add delay between pushes (except for the first one)
            if [ ${PUSH_COUNT} -gt 1 ]; then
              echo ""
              echo "⏱️  Waiting 3 seconds before next push..."
              sleep 3
            fi
            
            tag_version="${tag#*:}"
            echo ""
            echo "=========================================="
            echo "Push #${PUSH_COUNT}: oci://${tag}"
            echo "=========================================="
            
            # Verify structure before EACH push (if debug is enabled)
            if [ "${{ inputs.debug }}" = "true" ]; then
              echo "📁 Directory structure before push #${PUSH_COUNT}:"
              find "${BUNDLE_PATH}" -type d | sort
              echo "📄 File count: $(find "${BUNDLE_PATH}" -type f | wc -l)"
            fi
            
            echo ""
            echo "🚀 Pushing artifact..."
            RESULT=$(flux push artifact \
              "oci://${tag}" \
              --path="${BUNDLE_PATH}" \
              --source="https://github.com/${GITHUB_REPOSITORY}" \
              --revision="${tag_version}@sha1:$(git rev-parse HEAD)" \
              --output=json)

            CURRENT_DIGEST=$(echo "$RESULT" | jq -r '.digest')
            echo "✅ Push #${PUSH_COUNT} complete"
            echo "   Digest: ${CURRENT_DIGEST}"
            
            echo ""
            echo "Full push result:"
            echo "${RESULT}" | jq '.'
            
          done < <(echo "${{ steps.meta.outputs.tags }}")

          echo ""
          echo "=========================================="
          echo "Summary"
          echo "=========================================="
          echo "Total pushes: ${PUSH_COUNT}"

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
