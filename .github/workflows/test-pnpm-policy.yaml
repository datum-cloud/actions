name: Test pnpm policy

on:
  pull_request:
    paths:
      - "scripts/pnpm-policy/**"
      - ".github/workflows/pnpm-policy.yaml"
      - ".github/workflows/test-pnpm-policy.yaml"
  push:
    paths:
      - "scripts/pnpm-policy/**"
      - ".github/workflows/pnpm-policy.yaml"
      - ".github/workflows/test-pnpm-policy.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  test:
    name: Test policy outcomes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint scripts
        run: shellcheck scripts/pnpm-policy/*.sh
      - name: Run fixture tests
        run: bash scripts/pnpm-policy/test-pnpm-policy.sh

  self:
    name: Check this repository's pnpm fixtures
    uses: ./.github/workflows/pnpm-policy.yaml
    with:
      path: scripts/ci-basic/testdata/node-pnpm
