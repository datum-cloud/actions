name: Test plugin catalog updates

on:
  pull_request:
    paths:
      - "update-plugin-index/**"
      - ".github/workflows/test-update-plugin-index.yaml"
  push:
    paths:
      - "update-plugin-index/**"
      - ".github/workflows/test-update-plugin-index.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  test:
    name: Test plugin pull request reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint Bash scripts
        run: shellcheck update-plugin-index/*.sh
      - name: Run regression tests
        run: bash update-plugin-index/test-resolve-pr-branch.sh
