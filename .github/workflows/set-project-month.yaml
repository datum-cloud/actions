name: Set Project Iteration

on:
  workflow_call:

jobs:
  set-iteration:
    name: Set project iteration field
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATUM_PROJECT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DATUM_PROJECT_AUTOMATION_PRIVATE_KEY }}
          owner: datum-cloud

      - name: Set iteration field on project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PROJECT_NUMBER: 60
          PROJECT_ORG: datum-cloud
          FIELDS_QUERY: |
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 30) {
                    nodes {
                      ... on ProjectV2IterationField {
                        id
                        name
                        configuration {
                          iterations { id title startDate duration }
                          completedIterations { id title startDate duration }
                        }
                      }
                    }
                  }
                }
              }
            }
          PR_QUERY: |
            query($url: URI!) {
              resource(url: $url) {
                ... on PullRequest { id }
              }
            }
          ADD_QUERY: |
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                item { id }
              }
            }
          UPDATE_QUERY: |
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { iterationId: $iterationId }
              }) {
                projectV2Item { id }
              }
            }
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Today: $TODAY"

          PROJECT_DATA=$(gh api graphql -f query="$FIELDS_QUERY" \
            -f org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.id')
          echo "Project ID: $PROJECT_ID"

          ITERATION_FIELD_ID=$(echo "$PROJECT_DATA" | jq -r '.data.organization.projectV2.fields.nodes[] | select(.name == "Iteration") | .id')
          echo "Iteration field ID: $ITERATION_FIELD_ID"

          ALL_ITERATIONS=$(echo "$PROJECT_DATA" | jq -c '.data.organization.projectV2.fields.nodes[] | select(.name == "Iteration") | (.configuration.iterations + .configuration.completedIterations)')

          ITERATION_ID=""
          ITERATION_TITLE=""
          while IFS= read -r iter; do
            START=$(echo "$iter" | jq -r '.startDate')
            DURATION=$(echo "$iter" | jq -r '.duration')
            END=$(date -d "$START + $DURATION days" +%Y-%m-%d)
            if [[ "$TODAY" > "$START" || "$TODAY" == "$START" ]] && [[ "$TODAY" < "$END" ]]; then
              ITERATION_ID=$(echo "$iter" | jq -r '.id')
              ITERATION_TITLE=$(echo "$iter" | jq -r '.title')
              break
            fi
          done < <(echo "$ALL_ITERATIONS" | jq -c '.[]')

          if [ -z "$ITERATION_ID" ]; then
            echo "No iteration found covering $TODAY — skipping."
            echo "Add an iteration covering today's date to the Iteration field in project $PROJECT_NUMBER to enable automation."
            exit 0
          fi
          echo "Iteration: $ITERATION_TITLE ($ITERATION_ID)"

          PR_NODE_ID=$(gh api graphql -f query="$PR_QUERY" \
            -f url="$PR_URL" --jq '.data.resource.id')
          echo "PR node ID: $PR_NODE_ID"

          ITEM_ID=$(gh api graphql -f query="$ADD_QUERY" \
            -f projectId="$PROJECT_ID" -f contentId="$PR_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "Project item ID: $ITEM_ID"

          gh api graphql -f query="$UPDATE_QUERY" \
            -f projectId="$PROJECT_ID" \
            -f itemId="$ITEM_ID" \
            -f fieldId="$ITERATION_FIELD_ID" \
            -f iterationId="$ITERATION_ID"

          echo "Done — PR added to project $PROJECT_NUMBER with Iteration = $ITERATION_TITLE"
