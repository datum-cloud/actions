name: Bump npm Version

on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
        description: "The npm package name (e.g. `@datum-cloud/datum-ui`)"
      package-path:
        required: true
        type: string
        description: "Path to the package directory relative to the repo root (e.g. `packages/datum-ui`)"
      bump-type:
        required: true
        type: string
        description: "Version bump type: `major`, `minor`, or `patch`"
      node-version:
        required: false
        type: number
        description: "Node.js version to use"
        default: 26
    outputs:
      new-version:
        description: "The new version after bumping (e.g. `v1.3.0`)"
        value: ${{ jobs.bump.outputs.new-version }}

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-version: ${{ steps.resolve-version.outputs.new-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Resolve new version
        id: resolve-version
        working-directory: ${{ inputs.package-path }}
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          if [[ "$BUMP_TYPE" != "major" && "$BUMP_TYPE" != "minor" && "$BUMP_TYPE" != "patch" ]]; then
            echo "::error::Invalid bump-type '$BUMP_TYPE'. Must be one of: major, minor, patch"
            exit 1
          fi
          NEW_VERSION=$(node -e "
          const v = require('./package.json').version.split('.').map(Number);
          const t = process.env.BUMP_TYPE;
          if (t==='major'){v[0]++;v[1]=0;v[2]=0;}
          else if(t==='minor'){v[1]++;v[2]=0;}
          else{v[2]++;}
          console.log(v.join('.'));
          ")
          echo "new-version=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        working-directory: ${{ inputs.package-path }}
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: npm version "$BUMP_TYPE" --no-git-tag-version

      - name: Check workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z $WORKFLOW_REPOSITORY || -z $WORKFLOW_SHA ]]; then
            echo "::error title=Bump npm version::job.workflow_repository or job.workflow_sha is empty; this runner can't identify the workflow's own commit"
            exit 1
          fi
          echo "Commit script: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Checkout commit script
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sign-commit-action
          sparse-checkout: /scripts/sign-commit/sign-commit
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          NEW_VERSION: ${{ steps.resolve-version.outputs.new-version }}
        run: |
          EXPECTED_HEAD=$(git rev-parse HEAD)
          export EXPECTED_HEAD
          message="chore: release ${PACKAGE_NAME} ${NEW_VERSION} [skip ci]"
          url=$(git diff -z --name-only | .sign-commit-action/scripts/sign-commit/sign-commit -z main "$message")
          sha=${url##*/}
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" -f tag="$NEW_VERSION" -f message="$message" -f object="$sha" -f type=commit --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${NEW_VERSION}" -f sha="$tag_sha" >/dev/null
