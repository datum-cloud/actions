name: Test basic CI

on:
  pull_request:
    paths:
      - "scripts/ci-basic/**"
      - ".github/workflows/ci-basic.yaml"
      - ".github/workflows/test-ci-basic.yaml"
  push:
    paths:
      - "scripts/ci-basic/**"
      - ".github/workflows/ci-basic.yaml"
      - ".github/workflows/test-ci-basic.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/ci-basic/*.sh

  node:
    name: Node fixture
    uses: ./.github/workflows/ci-basic.yaml
    with:
      path: scripts/ci-basic/testdata/node-npm
      skip: lint

  go:
    name: Go and Docker fixture
    uses: ./.github/workflows/ci-basic.yaml
    with:
      path: scripts/ci-basic/testdata/go
      run: test -f go.mod
