name: Test drop distrusted roots

on:
  pull_request:
    paths:
      - "scripts/drop-distrusted-roots/**"
      - ".github/workflows/publish-docker.yaml"
      - ".github/workflows/test-drop-distrusted-roots.yaml"
  push:
    paths:
      - "scripts/drop-distrusted-roots/**"
      - ".github/workflows/publish-docker.yaml"
      - ".github/workflows/test-drop-distrusted-roots.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Lint scripts
        run: shellcheck scripts/drop-distrusted-roots/*.sh
      - name: Run filter tests
        run: bash scripts/drop-distrusted-roots/test-filter.sh

  # Runs the same two builds publish-docker.yaml runs, without the push, on a
  # distroless image whose Debian bundle still carries the emSign C1 and C3
  # roots, and checks the result on every platform.
  image:
    name: Test image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64
      - name: Build fixture image
        id: app
        uses: docker/build-push-action@v7.1.0
        with:
          context: scripts/drop-distrusted-roots/testdata/image
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/app-image,tar=false
          tags: |
            ghcr.io/datum-cloud/drop-distrusted-roots-test:v0.0.0-main
            ghcr.io/datum-cloud/drop-distrusted-roots-test:v1.2.3
      - name: Drop distrusted roots
        uses: docker/build-push-action@v7.1.0
        with:
          context: scripts/drop-distrusted-roots
          build-contexts: app=oci-layout://${{ runner.temp }}/app-image@${{ steps.app.outputs.digest }}
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/rootfs
      - name: Check bundles
        run: bash scripts/drop-distrusted-roots/check-rootfs.sh "$RUNNER_TEMP/rootfs" linux_amd64 linux_arm64
