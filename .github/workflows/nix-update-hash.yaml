name: Nix Update VendorHash

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod used by setup-go
        type: string
        default: go.mod
      task-command:
        description: Task command to run (must exist in the calling repo's Taskfile.yml)
        type: string
        default: nix-update-hash
      flake-path:
        description: Path to flake.nix to check for changes
        type: string
        default: flake.nix
      commit-message:
        description: Commit message for the vendorHash change
        type: string
        default: "chore(nix): update vendorHash for go deps"

permissions:
  contents: write

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Check workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z $WORKFLOW_REPOSITORY || -z $WORKFLOW_SHA ]]; then
            echo "::error title=Nix update hash::job.workflow_repository or job.workflow_sha is empty; this runner can't identify the workflow's own commit"
            exit 1
          fi
          echo "Commit script: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Checkout commit script
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sign-commit-action
          sparse-checkout: /scripts/sign-commit/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Update nix vendor hash and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TASK_COMMAND: ${{ inputs.task-command }}
          FLAKE_PATH: ${{ inputs.flake-path }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: .sign-commit-action/scripts/sign-commit/commit-generated "$BRANCH" "$COMMIT_MESSAGE" "$FLAKE_PATH" task "$TASK_COMMAND"
