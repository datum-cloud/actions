name: Update NOTICE

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod used by setup-go
        type: string
        default: go.mod
      task-command:
        description: Task command that regenerates NOTICE (must exist in the calling repo's Taskfile.yml)
        type: string
        default: notice
      notice-path:
        description: Path to the NOTICE file to check for changes
        type: string
        default: NOTICE
      commit-message:
        description: Commit message for the NOTICE change
        type: string
        default: "chore: update NOTICE for go deps"

permissions:
  contents: write

jobs:
  update-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Regenerate NOTICE
        env:
          TASK_COMMAND: ${{ inputs.task-command }}
        run: task "$TASK_COMMAND"

      - name: Checkout commit script
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sign-commit-action
          sparse-checkout: /scripts/sign-commit/sign-commit
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTICE_PATH: ${{ inputs.notice-path }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git diff --exit-code -- "$NOTICE_PATH" && exit 0
          .sign-commit-action/scripts/sign-commit/sign-commit "$BRANCH" "$COMMIT_MESSAGE" "$NOTICE_PATH"
