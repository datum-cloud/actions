name: Update NOTICE

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod used by setup-go
        type: string
        default: go.mod
      task-command:
        description: Task command that regenerates NOTICE (must exist in the calling repo's Taskfile.yml)
        type: string
        default: notice
      notice-path:
        description: Path to the NOTICE file to check for changes
        type: string
        default: NOTICE
      commit-message:
        description: Commit message for the NOTICE change
        type: string
        default: "chore: update NOTICE for go deps"

permissions:
  contents: write

jobs:
  update-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Check workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z $WORKFLOW_REPOSITORY || -z $WORKFLOW_SHA ]]; then
            echo "::error title=Update NOTICE::job.workflow_repository or job.workflow_sha is empty; this runner can't identify the workflow's own commit"
            exit 1
          fi
          echo "Commit script: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - name: Checkout commit script
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sign-commit-action
          sparse-checkout: /scripts/sign-commit/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Regenerate NOTICE and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TASK_COMMAND: ${{ inputs.task-command }}
          NOTICE_PATH: ${{ inputs.notice-path }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: .sign-commit-action/scripts/sign-commit/commit-generated "$BRANCH" "$COMMIT_MESSAGE" "$NOTICE_PATH" task "$TASK_COMMAND"
