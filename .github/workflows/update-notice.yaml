name: Update NOTICE

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod used by setup-go
        type: string
        default: go.mod
      task-command:
        description: Task command that regenerates NOTICE (must exist in the calling repo's Taskfile.yml)
        type: string
        default: notice
      notice-path:
        description: Path to the NOTICE file to check for changes
        type: string
        default: NOTICE
      commit-message:
        description: Commit message for the NOTICE change
        type: string
        default: "chore: update NOTICE for go deps"

permissions:
  contents: write

jobs:
  update-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Regenerate NOTICE
        env:
          TASK_COMMAND: ${{ inputs.task-command }}
        run: task "$TASK_COMMAND"

      - name: Commit and push changes
        env:
          NOTICE_PATH: ${{ inputs.notice-path }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git diff --exit-code -- "$NOTICE_PATH" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$NOTICE_PATH"
          git commit -m "$COMMIT_MESSAGE"
          # Other workflows triggered by the same go.mod push (such as
          # nix-update-hash) may push to this branch first; rebase onto
          # their commit and retry.
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "Push attempt $attempt rejected, rebasing onto $BRANCH"
            git pull --rebase origin "$BRANCH"
          done
          exit 1
