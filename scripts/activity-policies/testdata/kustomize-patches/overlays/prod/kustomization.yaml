apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Both files are kind: ActivityPolicy with only part of a policy; auto-discovery
# must not validate them on their own.
patches:
  - path: group-patch.yaml # inline comments are ignored
    target:
      kind: ActivityPolicy
  - patch: |-
      - op: add
        path: /metadata/labels/inline
        value: "true"
    target:
      kind: ActivityPolicy

patchesStrategicMerge:
  - "legacy-patch.yaml"
