apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: resourcemanager.miloapis.com-project
spec:
  resource:
    apiGroup: resourcemanager.miloapis.com
    kind: Project
  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} created project {{ link(audit.objectRef.name, audit.objectRef) }}"
  eventRules:
    - name: suspended
      match: "event.reason == 'Suspended'"
      summary: "Project {{ event.regarding.name }} was suspended"
